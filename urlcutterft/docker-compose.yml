version: "3.9"

services:
  frontend:
    container_name: urlcutter
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true

    restart: unless-stopped